<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f3ff">
  <title>Call Log | Cebu Emergency Finder</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../styles/screens/citizen-log.css">
</head>
<body>
  <main id="app" class="app-shell" aria-live="polite">
    <section class="citizen-page">
      <header class="page-header"><button class="back-link" type="button" data-nav="#citizen/home" aria-label="Go back"><span aria-hidden="true">←</span> Back</button><h1 class="page-title">Your call log</h1></header>
      <p class="screen-subtitle">Call attempts are saved on this device for this demo.</p>
      <div data-call-log><div class="empty-state card"><span class="empty-symbol" aria-hidden="true">▤</span><strong>No incidents yet</strong><p>No calls yet. Find a responder and press Call to record one here.</p></div></div>
    </section>
    <nav class="bottom-nav" aria-label="Citizen navigation">
      <button type="button" data-nav="#citizen/home"><span class="nav-icon" aria-hidden="true">⌕</span>Find</button>
      <button type="button" data-nav="#citizen/responders"><span class="nav-icon" aria-hidden="true">♙</span>Responder</button>
      <button type="button" data-nav="#citizen/log" aria-current="page"><span class="nav-icon" aria-hidden="true">▤</span>Log</button>
    </nav>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="../../js/screens/citizen-log.js"></script>
</body>
</html>
