<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f3ff">
  <title>Find Responders | Cebu Emergency Finder</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../styles/screens/citizen-home.css">
</head>
<body>
  <main id="app" class="app-shell" aria-live="polite">
    <section class="citizen-page">
      <div class="brand"><span class="brand-mark" aria-hidden="true">+</span><span>Cebu Emergency Finder</span></div>
      <div class="home-heading"><div><p class="eyebrow">Cebu City · Ginatilan</p><h1 class="screen-title">Emergency Responder Locator</h1></div><button class="icon-button" type="button" data-action="go-role" aria-label="Back to role selection">↩</button></div>
      <label class="search-box"><span aria-hidden="true">⌕</span><input type="search" data-search="categories" placeholder="Search for help" aria-label="Search services"><button type="button" data-action="voice-search" aria-label="Voice search">◖</button></label>
      <h2 class="section-label">Who do you need?</h2>
      <div class="category-grid">
        <button class="category-card card" type="button" data-category="ambulance"><span class="category-icon">＋</span><strong>Ambulance</strong><small data-count="Ambulance">1 available</small></button>
        <button class="category-card card" type="button" data-category="fire"><span class="category-icon">◇</span><strong>Fire Station</strong><small data-count="Fire Station">2 available</small></button>
        <button class="category-card card" type="button" data-category="tanod"><span class="category-icon">⌂</span><strong>Barangay Tanod</strong><small data-count="Barangay Tanod">1 available</small></button>
        <button class="category-card card" type="button" data-category="police"><span class="category-icon">▣</span><strong>Police</strong><small data-count="Police">1 available</small></button>
        <button class="category-card card" type="button" data-category="nearest"><span class="category-icon">⌖</span><strong>Nearest Any</strong><small data-count="Any">5 available</small></button>
      </div>
      <button class="outage-card card" type="button" data-category="outage"><span class="outage-icon">ϟ</span><span><strong>Power Outage / Cebeco</strong><small>Report or find outage support</small></span><span aria-hidden="true">›</span></button>
      <button class="emergency-banner" type="button" data-action="call-911">Life-threatening? Call <strong>911</strong> now</button>
      <p class="demo-note">Availability and distances are sample data.</p>
    </section>
    <nav class="bottom-nav" aria-label="Citizen navigation">
      <button type="button" data-nav="#citizen/home" aria-current="page"><span class="nav-icon" aria-hidden="true">⌕</span>Find</button>
      <button type="button" data-nav="#citizen/responders"><span class="nav-icon" aria-hidden="true">♙</span>Responder</button>
      <button type="button" data-nav="#citizen/log"><span class="nav-icon" aria-hidden="true">▤</span>Log</button>
    </nav>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="../../js/screens/citizen-home.js"></script>
</body>
</html>
