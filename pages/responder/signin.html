<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f3ff">
  <title>Responder Sign In | Cebu Emergency Finder</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../styles/screens/responder-signin.css">
</head>
<body>
  <main id="app" class="app-shell" aria-live="polite">
    <section class="auth-page responder-auth">
      <div class="brand"><span class="brand-mark" aria-hidden="true">+</span><span>Cebu Emergency Finder</span></div>
      <div class="safety-card"><span class="shield-icon">⛨</span><strong>For verified<br>responders only</strong></div>
      <h1 class="screen-title">Responder sign in</h1>
      <p class="screen-subtitle">Use the mobile number registered with your unit. We'll text you the code.</p>
      <label class="field-label" for="phone">Mobile Number</label>
      <div class="phone-group"><span>+63</span><input id="phone" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="9XX XXX XXXX" maxlength="13" value="991 654 2601"></div>
      <p id="phone-error" class="form-error" aria-live="polite"></p>
      <button class="primary-button full-width" type="button" data-action="responder-send-code">Send Code</button>
      <button class="link-button" type="button" data-nav="#role">I'm not a responder</button>
      <div class="auth-note card">ⓘ Only registered responder numbers can request access. Your account must be approved before going live.</div>
      <p class="demo-note">Demo verification code: <strong>1234</strong></p>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="../../js/screens/responder-signin.js"></script>
</body>
</html>
