<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f3ff">
  <title>Responder Profile | Cebu Emergency Finder</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../styles/screens/responder-profile.css">
</head>
<body>
  <main id="app" class="app-shell" aria-live="polite">
    <section class="responder-page workspace-page">
      <header class="workspace-header"><div><p class="eyebrow">AMBULANCE 1</p><h1 class="page-title">Profile</h1></div><span class="avatar">JD</span></header>
      <div class="profile-card card">
        <div class="profile-row"><small>Name</small><strong>Juan Dela Cruz</strong></div>
        <div class="profile-row"><small>Unit</small><strong>Ambulance 1</strong></div>
        <div class="profile-row"><small>Station</small><strong>Ginatilan Rural Health Unit</strong></div>
        <div class="profile-row"><small>Mobile</small><strong data-masked-phone>+63 ••• ••• ••••</strong></div>
        <div class="profile-row"><small>Account</small><strong data-account-status>Pending admin approval</strong></div>
      </div>
      <button class="secondary-button full-width" type="button" data-action="contact-admin">Contact Admin</button>
      <button class="link-button" type="button" data-action="logout">Log out</button>
    </section>
    <nav class="bottom-nav responder-nav" aria-label="Responder navigation">
      <button type="button" data-nav="#responder/today"><span class="nav-icon">⌂</span>Today</button>
      <button type="button" data-nav="#responder/history"><span class="nav-icon">▤</span>History</button>
      <button type="button" data-nav="#responder/profile" aria-current="page"><span class="nav-icon">♙</span>Profile</button>
    </nav>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="../../js/screens/responder-profile.js"></script>
</body>
</html>
