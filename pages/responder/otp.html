<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f3ff">
  <title>Verify Responder | Cebu Emergency Finder</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../styles/screens/responder-otp.css">
</head>
<body>
  <main id="app" class="app-shell" aria-live="polite">
    <section class="auth-page otp-page">
      <button class="back-link" type="button" data-nav="#responder/signin" aria-label="Go back"><span aria-hidden="true">←</span> Back</button>
      <h1 class="screen-title">Enter the code</h1>
      <p class="screen-subtitle">We sent a 4-digit code to <strong data-masked-phone>+63 ••• ••• ••••</strong>.</p>
      <div class="otp-fields" role="group" aria-label="Four digit verification code">
        <input type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="Digit 1" data-otp="0">
        <input type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Digit 2" data-otp="1">
        <input type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Digit 3" data-otp="2">
        <input type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Digit 4" data-otp="3">
      </div>
      <p id="otp-error" class="form-error" aria-live="polite"></p>
      <button class="primary-button full-width" type="button" data-action="responder-verify">Verify</button>
      <button id="resend-code" class="link-button" type="button" data-action="responder-resend" disabled>Resend code in <span data-countdown>0:42</span></button>
      <div class="auth-note card">ⓘ Never share the code with anyone. SMS delivery may be delayed in areas with weak signal.</div>
      <p class="demo-note">Demo verification code: <strong>1234</strong></p>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="../../js/screens/responder-otp.js"></script>
</body>
</html>
