<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f3ff">
  <title>Responder Team | Cebu Emergency Finder</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../styles/screens/admin-team.css">
</head>
<body>
  <main id="app" class="app-shell" aria-live="polite">
    <section class="admin-page">
      <header class="admin-header"><div><p class="eyebrow">CEBU CITY DISPATCH</p><h1 class="page-title">Responder team</h1></div><button class="avatar" type="button" data-action="logout" aria-label="Log out of admin demo">RV</button></header>
      <div class="team-toolbar"><p class="screen-subtitle"><span data-team-count>0</span> registered units</p><button class="secondary-button" type="button" data-action="add-responder">＋ Add Responder</button></div>
      <div class="filter-row admin-filter" role="group" aria-label="Filter team units">
        <button type="button" class="filter-chip" data-team-filter="All" aria-pressed="false">All</button>
        <button type="button" class="filter-chip" data-team-filter="Available" aria-pressed="false">Available</button>
        <button type="button" class="filter-chip" data-team-filter="Busy" aria-pressed="false">Busy</button>
        <button type="button" class="filter-chip" data-team-filter="Off" aria-pressed="false">Off</button>
      </div>
      <div class="team-list" data-team-list></div>
    </section>
    <nav class="bottom-nav admin-nav" aria-label="Dispatch navigation">
      <button type="button" data-nav="#admin/live"><span class="nav-icon">⌖</span>Live</button>
      <button type="button" data-nav="#admin/map"><span class="nav-icon">◇</span>Map</button>
      <button type="button" data-nav="#admin/approvals"><span class="nav-icon">✓</span>Approval</button>
      <button type="button" data-nav="#admin/team" aria-current="page"><span class="nav-icon">♙</span>Team</button>
      <button type="button" data-nav="#admin/history"><span class="nav-icon">▤</span>History</button>
    </nav>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="../../js/screens/admin-team.js"></script>
</body>
</html>
