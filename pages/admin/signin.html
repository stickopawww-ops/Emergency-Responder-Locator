<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f3ff">
  <title>Admin Sign In | Cebu Emergency Finder</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../styles/screens/admin-signin.css">
</head>
<body>
  <main id="app" class="app-shell" aria-live="polite">
    <section class="admin-auth">
      <div class="brand"><span class="brand-mark" aria-hidden="true">+</span><span>Cebu Emergency Finder</span></div>
      <div class="admin-auth-mark">▦</div>
      <h1 class="screen-title">Admin sign in</h1>
      <p class="screen-subtitle">Sign in with your dispatch account.</p>
      <label class="field-label" for="admin-email">Work email</label>
      <input id="admin-email" class="form-input" type="email" placeholder="name@agency.gov.ph" autocomplete="username">
      <label class="field-label" for="admin-password">Password</label>
      <div class="password-field"><input id="admin-password" class="form-input" type="password" placeholder="Enter your password" autocomplete="current-password"><button type="button" data-action="toggle-password" aria-label="Show password">Show</button></div>
      <p id="admin-error" class="form-error" aria-live="polite"></p>
      <button class="primary-button full-width" type="button" data-action="admin-send-code">Continue</button>
      <button class="link-button" type="button" data-action="forgot-password">Forgot password?</button>
      <div class="auth-note card">Admin actions are recorded in the local demo activity log. This is not a secure production sign-in.</div>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="../../js/screens/admin-signin.js"></script>
</body>
</html>
