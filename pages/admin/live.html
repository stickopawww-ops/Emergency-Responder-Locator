<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f3ff">
  <title>Live Dispatch | Cebu Emergency Finder</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../styles/screens/admin-live.css">
</head>
<body>
  <main id="app" class="app-shell" aria-live="polite">
    <section class="admin-page">
      <header class="admin-header"><div><p class="eyebrow">CEBU CITY DISPATCH</p><h1 class="page-title">Live incidents</h1></div><button class="avatar" type="button" data-action="logout" aria-label="Log out of admin demo">RV</button></header>
      <div class="summary-grid">
        <div class="summary-card card"><strong data-summary="active">0</strong><small>Active</small></div>
        <div class="summary-card card"><strong data-summary="unassigned">0</strong><small>Unassigned</small></div>
        <div class="summary-card card"><strong data-summary="free">0</strong><small>Units free</small></div>
      </div>
      <button class="alert-all-button" type="button" data-action="alert-units">Send alert to all units <span>→</span></button>
      <div class="admin-section-heading"><h2 class="section-label">Dispatch queue</h2><button class="quiet-button" type="button" data-action="new-sos">＋ New SOS</button></div>
      <div class="filter-row admin-filter" role="group" aria-label="Incident filter">
        <button type="button" class="filter-chip" data-admin-filter="All active" aria-pressed="false">All active</button>
        <button type="button" class="filter-chip" data-admin-filter="Unassigned" aria-pressed="false">Unassigned</button>
      </div>
      <div class="incident-list" data-incident-list></div>
      <button class="secondary-button full-width" type="button" data-action="backup-request">Demo: Backup request</button>
    </section>
    <nav class="bottom-nav admin-nav" aria-label="Dispatch navigation">
      <button type="button" data-nav="#admin/live" aria-current="page"><span class="nav-icon">⌖</span>Live</button>
      <button type="button" data-nav="#admin/map"><span class="nav-icon">◇</span>Map</button>
      <button type="button" data-nav="#admin/approvals"><span class="nav-icon">✓</span>Approval</button>
      <button type="button" data-nav="#admin/team"><span class="nav-icon">♙</span>Team</button>
      <button type="button" data-nav="#admin/history"><span class="nav-icon">▤</span>History</button>
    </nav>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="../../js/screens/admin-live.js"></script>
</body>
</html>
