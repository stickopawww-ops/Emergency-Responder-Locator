<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f3ff">
  <title>Dispatch History | Cebu Emergency Finder</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../styles/screens/admin-history.css">
</head>
<body>
  <main id="app" class="app-shell" aria-live="polite">
    <section class="admin-page">
      <header class="admin-header"><div><p class="eyebrow">CEBU CITY DISPATCH</p><h1 class="page-title">History</h1></div><button class="avatar" type="button" data-action="logout" aria-label="Log out of admin demo">RV</button></header>
      <label class="search-box history-search"><span>⌕</span><input type="search" data-search="admin-history" placeholder="Search incidents, places, units" aria-label="Search incidents, places, units"></label>
      <div class="filter-row history-tabs" role="group" aria-label="History type">
        <button type="button" class="filter-chip" data-history-tab="Incident">Incident</button>
        <button type="button" class="filter-chip" data-history-tab="Activity Log">Activity Log</button>
      </div>
      <div class="filter-row status-filter" data-history-status-filters>
        <button type="button" class="filter-chip" data-history-filter="All">All</button>
        <button type="button" class="filter-chip" data-history-filter="Resolved">Resolved</button>
        <button type="button" class="filter-chip" data-history-filter="False Alarm">False Alarm</button>
      </div>
      <div class="history-results" data-history-results></div>
      <button class="secondary-button full-width export-button" type="button" data-action="export-csv">Export report (CSV)</button>
    </section>
    <nav class="bottom-nav admin-nav" aria-label="Dispatch navigation">
      <button type="button" data-nav="#admin/live"><span class="nav-icon">⌖</span>Live</button>
      <button type="button" data-nav="#admin/map"><span class="nav-icon">◇</span>Map</button>
      <button type="button" data-nav="#admin/approvals"><span class="nav-icon">✓</span>Approval</button>
      <button type="button" data-nav="#admin/team"><span class="nav-icon">♙</span>Team</button>
      <button type="button" data-nav="#admin/history" aria-current="page"><span class="nav-icon">▤</span>History</button>
    </nav>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="../../js/screens/admin-history.js"></script>
</body>
</html>
