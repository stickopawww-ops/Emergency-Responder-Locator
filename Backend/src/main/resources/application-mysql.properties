spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/emergency_responder_locator?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:responder_app}
spring.datasource.password=${DATABASE_PASSWORD:CHANGE_THIS_LOCAL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.h2.console.enabled=false
