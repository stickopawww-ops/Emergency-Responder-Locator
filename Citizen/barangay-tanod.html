<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f3ff">
  <title>Nearest Barangay Tanod</title>
  <link rel="stylesheet" href="fire-station.css">
  <link rel="stylesheet" href="barangay-tanod.css">
  <script src="barangay-tanod.js" defer></script>
</head>
<body>
  <div class="mobile-frame">
    <header class="app-header">
      <button class="back-btn" type="button" aria-label="Back to services">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19 12H5M12 19l-7-7 7-7"></path>
        </svg>
      </button>
      <h1 class="header-title">Nearest Barangay Tanod</h1>
    </header>

    <main class="content-area">
      <section class="map-section" aria-label="Barangay Tanod locations">
        <div class="map-panel tanod-map-panel">
          <p class="map-caption-top">Ginatilan · schematic</p>
          <div class="map-container">
            <svg class="map-art" viewBox="0 0 360 190" role="img" aria-labelledby="map-title map-desc" preserveAspectRatio="xMidYMid slice">
              <title id="map-title">Schematic map of Ginatilan</title>
              <desc id="map-desc">Illustrated coastline, roads, and approximate Tanod locations in San Roque and Palanas. This is not a live GPS map.</desc>
              <rect width="360" height="190" fill="#b9dbe3"></rect>
              <path d="M0 0h239c-15 17-11 34-28 48-15 13-9 29-20 42-11 14-10 30-22 44-10 12-15 33-27 56H0z" fill="#eeeade"></path>
              <path d="M258 0h102v190H197c15-21 25-35 29-53 4-20 19-28 19-48s17-26 13-45c-3-18 7-30 0-44z" fill="#e7e4d7"></path>
              <path d="M22 0c18 31 39 42 57 60s26 37 44 53 24 42 39 77" fill="none" stroke="#fff" stroke-width="8"></path>
              <path d="M67 28c40 3 65 12 96 24s51 24 82 22m-204 73c53-16 84-10 122-19s63-27 112-24" fill="none" stroke="#fff" stroke-width="5"></path>
              <path d="M24 46l64-12m-74 96 76-16m128-82 92 8m-99 106 88 12" stroke="#d6d3c7" stroke-width="2"></path>
              <g fill="#8bb7a1" opacity=".8">
                <path d="M163 4h27l-10 20h-27zM233 83h27l-10 20h-27zM56 93h27l-10 20H46z"></path>
              </g>
              <g fill="#60787d" font-family="Arial, sans-serif" font-size="8">
                <text x="12" y="17">Ginatilan</text>
                <text x="12" y="182">Bohol Sea</text>
                <text x="276" y="176">Palanas</text>
                <text x="210" y="39">San Roque</text>
                <text x="98" y="90">Coastal Road</text>
              </g>
              <g transform="translate(145 63)">
                <circle r="5" fill="#087d75" stroke="#fff" stroke-width="2"></circle>
                <rect x="8" y="-10" width="100" height="19" rx="6" fill="#fff" opacity=".96"></rect>
                <text x="14" y="3" fill="#172333" font-family="Arial, sans-serif" font-size="9" font-weight="700">Tanod · San Roque</text>
              </g>
              <g transform="translate(164 124)">
                <circle r="5" fill="#087d75" stroke="#fff" stroke-width="2"></circle>
                <rect x="8" y="-10" width="86" height="19" rx="6" fill="#fff" opacity=".96"></rect>
                <text x="14" y="3" fill="#172333" font-family="Arial, sans-serif" font-size="9" font-weight="700">Tanod · Palanas</text>
              </g>
            </svg>
          </div>
          <p class="map-caption-bottom">Estimated station locations · not live GPS</p>
        </div>
      </section>

      <section class="station-list" aria-label="Nearby Barangay Tanod responders">
        <article class="station-card">
          <div class="fire-icon shield-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M12 3 19 6v5c0 4.5-2.9 8-7 10-4.1-2-7-5.5-7-10V6l7-3z"></path>
              <path d="m9 12 2 2 4-4"></path>
            </svg>
          </div>
          <div class="station-info">
            <h2>Barangay Tanod</h2>
            <p class="station-location">San Roque Barangay Hall</p>
            <div class="status-row">
              <span class="availability"><span class="status-dot"></span>Available</span>
              <span class="distance">1.1 km</span>
            </div>
          </div>
          <button class="call-btn" type="button" data-location="San Roque Barangay Hall">Call</button>
        </article>

        <article class="station-card">
          <div class="fire-icon shield-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M12 3 19 6v5c0 4.5-2.9 8-7 10-4.1-2-7-5.5-7-10V6l7-3z"></path>
              <path d="m9 12 2 2 4-4"></path>
            </svg>
          </div>
          <div class="station-info">
            <h2>Barangay Tanod</h2>
            <p class="station-location">Palanas Barangay Hall</p>
            <div class="status-row">
              <span class="availability busy"><span class="status-dot"></span>Busy</span>
              <span class="distance">2.8 km</span>
            </div>
          </div>
          <button class="call-btn" type="button" data-location="Palanas Barangay Hall">Call</button>
        </article>
      </section>

      <p class="feedback" aria-live="polite" hidden></p>
    </main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <a class="nav-item active" href="citizen.html" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10.8" cy="10.8" r="6.3"></circle>
          <path d="m15.5 15.5 4.2 4.2"></path>
        </svg>
        <span>Find</span>
      </a>
      <a class="nav-item" href="responders.html">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="9" cy="8" r="3"></circle>
          <path d="M3.5 19v-1.5a5.5 5.5 0 0 1 11 0V19zM16 5.5a3 3 0 0 1 0 5.8M18 14a4.5 4.5 0 0 1 2.5 4v1"></path>
        </svg>
        <span>Responder</span>
      </a>
      <button class="nav-item" type="button" data-nav="Log">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 3.5h9l3 3V20H6zM15 3.5v4h4M9 12h6M9 16h6"></path>
        </svg>
        <span>Log</span>
      </button>
    </nav>
  </div>
</body>
</html>
