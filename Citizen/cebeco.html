
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Power Outage</title>
  <link rel="stylesheet" href="cebeco.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <script src="cebeco.js" defer></script>
</head>
<body>

  <div class="phone">

    <!-- HEADER -->
    <header class="topbar">
      <button class="back-btn" onclick="goBack()">
        <svg viewBox="0 0 24 24">
          <path d="M15 18L9 12L15 6"/>
        </svg>
      </button>

      <div class="title">Power Outage</div>
    </header>

    <!-- MAP LABEL -->
    <div class="section-label">
      Nearest Power Outage
    </div>

    <!-- MAP -->
    <div class="map-container">

      <svg class="map-art" viewBox="0 0 360 145"
           preserveAspectRatio="none">

        <rect width="360" height="145" fill="#bce2e5"/>

        <path d="M155 -10 L360 -10 L360 155
                 L205 155 L190 85 L175 50 Z"
              fill="#eeece7"/>

        <path d="M170 -10 L205 45 L225 90 L245 155"
              stroke="#ffffff" stroke-width="7" fill="none"/>

        <path d="M195 48 L360 12"
              stroke="#ffffff" stroke-width="3" fill="none"/>

        <path d="M215 87 L360 55"
              stroke="#ffffff" stroke-width="3" fill="none"/>

        <path d="M250 115 L360 85"
              stroke="#ffffff" stroke-width="3" fill="none"/>

        <path d="M245 5 L285 145"
              stroke="#ffffff" stroke-width="2" fill="none"/>

      </svg>

      <!-- OUTAGE LOCATION -->
      <div class="map-label location-one">
        <span class="map-dot"></span>
        Power Outage
      </div>

      <!-- USER LOCATION -->
      <div class="user-marker">
        <i class="fa-solid fa-location-dot"></i>
      </div>

    </div>

    <!-- STATION LABEL -->
    <div class="section-label station-label">
      Preferred Power Station
    </div>

    <!-- POWER OUTAGE LIST -->
    <div class="outage-list">

      <div class="outage-card">

        <div class="icon-wrap">
          <i class="fa-solid fa-bolt"></i>
        </div>

        <div class="card-text">

          <h3>Cebeco 1</h3>

          <span>Power Outage Responder</span>

          <div class="status-row">

            <span class="status available">
              <i class="fa-solid fa-circle"></i>
              Available
            </span>

            <small>1.2 km</small>

          </div>

        </div>

        <button class="call-btn"
                onclick="callResponder('Cable 1')">
          Call
        </button>

      </div>

    </div>

    <!-- BOTTOM NAVIGATION -->
    <div class="bottom-nav">

      <button class="nav-item"
              onclick="goToPage('citizen.html')">

        <svg viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="6"></circle>
          <path d="M16 16L21 21"></path>
        </svg>

        <span>Find</span>

      </button>

      <button class="nav-item"
              onclick="goToPage('responders.html')">

        <svg viewBox="0 0 24 24">
          <path d="M12 3a9 9 0 1 0 9 9"></path>
          <path d="M12 7v5l3 2"></path>
        </svg>

        <span>Responder</span>

      </button>

      <button class="nav-item"
              onclick="goToPage('log.html')">

        <svg viewBox="0 0 24 24">
          <path d="M6 3.5h9l3 3V19a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5.5a2 2 0 0 1 2-2z"></path>
          <path d="M15 3.5v4h4"></path>
          <path d="M8 11h8"></path>
          <path d="M8 15h8"></path>
        </svg>

        <span>Log</span>

      </button>

    </div>

  </div>

</body>
</html>
