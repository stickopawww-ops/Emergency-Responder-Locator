<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f3ff">
  <title>Nearest Police</title>
  <link rel="stylesheet" href="fire-station.css">
  <link rel="stylesheet" href="police.css">
  <script src="police.js" defer></script>
</head>
<body>
  <div class="mobile-frame">
    <header class="app-header">
      <button class="back-btn" type="button" aria-label="Back to services">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19 12H5M12 19l-7-7 7-7"></path>
        </svg>
      </button>
      <h1 class="header-title">Nearest Police</h1>
    </header>

    <main class="content-area">
      <section class="map-section" aria-label="Police station locations">
        <div class="map-panel police-map-panel">
          <p class="map-caption-top">Ginatilan-Samboan · schematic</p>
          <div class="map-container">
            <svg class="map-art" viewBox="0 0 360 190" role="img" aria-labelledby="map-title map-desc" preserveAspectRatio="xMidYMid slice">
              <title id="map-title">Schematic map of Ginatilan and Samboan</title>
              <desc id="map-desc">Illustrated coastline, roads, and approximate police station locations. This is not a live GPS map.</desc>
              <rect width="360" height="190" fill="#b9dbe3"></rect>
              <path d="M123 0h237v190H106c12-23 4-36 17-54 15-19 4-35 17-54 12-18 4-32 16-48 12-15 5-23-33-34z" fill="#eeeade"></path>
              <path d="M128 0c22 20 9 34-3 50-12 17-5 34-17 52-12 18-3 34-17 52-9 12-8 22-7 36" fill="none" stroke="#fff" stroke-width="7"></path>
              <path d="M168 24c33-9 61 3 91 0s57 4 91-11M130 77c42-15 76-5 107 3s60 3 109-8m-129 87c26-20 66-17 95-9s40 9 48 13" fill="none" stroke="#fff" stroke-width="5"></path>
              <path d="M179 11l-18 18m88 14 29-20m-125 91-37 16m133-8 22 17m43-116 19 13" stroke="#d6d3c7" stroke-width="2"></path>
              <g fill="#8bb7a1" opacity=".8">
                <path d="M192 60h26l-10 19h-25zM293 72h29l-10 20h-27zM233 149h30l-11 20h-28zM329 27h22l-9 17h-22z"></path>
              </g>
              <g fill="#60787d" font-family="Arial, sans-serif" font-size="8">
                <text x="12" y="17">Ginatilan</text>
                <text x="47" y="112">Tañon Strait</text>
                <text x="278" y="178">Samboan</text>
                <text x="163" y="36">Poblacion</text>
                <text x="244" y="118">Coastal Road</text>
              </g>
              <g transform="translate(163 57)">
                <circle r="5" fill="#087d75" stroke="#fff" stroke-width="2"></circle>
                <rect x="8" y="-10" width="104" height="19" rx="6" fill="#fff" opacity=".96"></rect>
                <text x="14" y="3" fill="#172333" font-family="Arial, sans-serif" font-size="9" font-weight="700">Police 1 · Ginatilan</text>
              </g>
              <g transform="translate(175 128)">
                <circle r="5" fill="#087d75" stroke="#fff" stroke-width="2"></circle>
                <rect x="8" y="-10" width="101" height="19" rx="6" fill="#fff" opacity=".96"></rect>
                <text x="14" y="3" fill="#172333" font-family="Arial, sans-serif" font-size="9" font-weight="700">Police 2 · Samboan</text>
              </g>
            </svg>
          </div>
          <p class="map-caption-bottom">Estimated station locations · Not live GPS</p>
        </div>
      </section>

      <section class="station-list" aria-label="Nearby police stations">
        <article class="station-card">
          <div class="fire-icon siren-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M5 18h14l-1.1-7.2a5.9 5.9 0 0 0-11.8 0L5 18z"></path>
              <path d="M3 21h18M12 3V1M5.2 5.2 3.8 3.8m15 1.4 1.4-1.4M2 11H1m22 0h-1"></path>
            </svg>
          </div>
          <div class="station-info">
            <h2>Police 1</h2>
            <p class="station-location">Ginatilan Municipal Police Station</p>
            <div class="status-row">
              <span class="availability"><span class="status-dot"></span>Available</span>
              <span class="distance">1.0 km</span>
            </div>
          </div>
          <button class="call-btn" type="button" data-station="Police 1">Call</button>
        </article>

        <article class="station-card">
          <div class="fire-icon siren-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M5 18h14l-1.1-7.2a5.9 5.9 0 0 0-11.8 0L5 18z"></path>
              <path d="M3 21h18M12 3V1M5.2 5.2 3.8 3.8m15 1.4 1.4-1.4M2 11H1m22 0h-1"></path>
            </svg>
          </div>
          <div class="station-info">
            <h2>Police 2</h2>
            <p class="station-location">Samboan Municipal Police Station</p>
            <div class="status-row">
              <span class="availability busy"><span class="status-dot"></span>Busy</span>
              <span class="distance">2.0 km</span>
            </div>
          </div>
          <button class="call-btn" type="button" data-station="Police 2">Call</button>
        </article>
      </section>

      <p class="feedback" aria-live="polite" hidden></p>
    </main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <a class="nav-item active" href="citizen.html" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10.8" cy="10.8" r="6.3"></circle>
          <path d="m15.5 15.5 4.2 4.2"></path>
        </svg>
        <span>Find</span>
      </a>
      <a class="nav-item" href="../Sign-In/Screens/responder-sign-in/sign-in.html">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="9" cy="8" r="3"></circle>
          <path d="M3.5 19v-1.5a5.5 5.5 0 0 1 11 0V19zM16 5.5a3 3 0 0 1 0 5.8M18 14a4.5 4.5 0 0 1 2.5 4v1"></path>
        </svg>
        <span>Responder</span>
      </a>
      <button class="nav-item" type="button" data-nav="Log">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 3.5h9l3 3V20H6zM15 3.5v4h4M9 12h6M9 16h6"></path>
        </svg>
        <span>Log</span>
      </button>
    </nav>
  </div>
</body>
</html>
