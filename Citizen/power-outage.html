<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f3ff">
  <title>Power Outage</title>
  <link rel="stylesheet" href="fire-station.css">
  <link rel="stylesheet" href="power-outage.css">
  <script src="../api-client.js" defer></script>
  <script src="power-outage.js" defer></script>
</head>
<body>
  <div class="mobile-frame">
    <header class="app-header">
      <button class="back-btn" type="button" aria-label="Back to services">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19 12H5M12 19l-7-7 7-7"></path>
        </svg>
      </button>
      <h1 class="header-title">Power Outage</h1>
    </header>

    <main class="content-area">
      <section class="map-section" aria-label="Estimated CEBECO service area">
        <div class="map-panel power-map-panel">
          <div class="map-container">
            <svg class="map-art" viewBox="0 0 360 200" role="img" aria-labelledby="map-title map-desc" preserveAspectRatio="xMidYMid slice">
              <title id="map-title">Schematic CEBECO service-area map</title>
              <desc id="map-desc">Illustrated map with the Tañon Strait on the west and an estimated CEBECO service-area marker. This is not a live outage map.</desc>
              <rect width="360" height="200" fill="#d5e8cb"></rect>
              <path d="M0 0h74c-5 24 4 41-2 62s7 44 0 65 6 46 0 73H0z" fill="#b9e3eb"></path>
              <path d="M74 0c-5 24 4 41-2 62s7 44 0 65 6 46 0 73" fill="none" stroke="#abd3bf" stroke-width="5"></path>
              <g stroke="#bfd4b8" stroke-width="1.5">
                <path d="M77 0v200M145 0v200M218 0v200M286 0v200"></path>
                <path d="M74 35h286M72 82h288M72 128h288M70 174h290"></path>
              </g>
              <g stroke="#eef3e6" stroke-width="3">
                <path d="M88 0v200M184 0v200M252 0v200"></path>
                <path d="M74 58h286M72 105h288M71 151h289"></path>
              </g>
              <g fill="#657f7b" font-family="Arial, sans-serif" font-size="10">
                <text x="12" y="106">Tañon Strait</text>
                <text x="10" y="187">Dinalian · schematic</text>
                <text x="257" y="187">Estimated service area</text>
              </g>
              <g transform="translate(214 74)">
                <path d="M0-15a10 10 0 0 0-10 10c0 8 10 20 10 20S10 3 10-5A10 10 0 0 0 0-15z" fill="#075451" stroke="#fff" stroke-width="2"></path>
                <circle cy="-5" r="3" fill="#fff"></circle>
                <rect x="-40" y="-37" width="57" height="18" rx="5" fill="#fff" stroke="#d7dfd4"></rect>
                <text x="-33" y="-25" fill="#14504e" font-family="Arial, sans-serif" font-size="10" font-weight="700">CEBECO 1</text>
              </g>
            </svg>
            <div class="map-zoom" aria-label="Map zoom controls">
              <button type="button" data-zoom="in" aria-label="Zoom in">+</button>
              <button type="button" data-zoom="out" aria-label="Zoom out">−</button>
            </div>
          </div>
        </div>
      </section>

      <section class="station-list" aria-label="Nearby electric cooperative service">
        <article class="station-card">
          <div class="fire-icon power-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M13.5 2 5 13h6l-.5 9L19 10h-6l.5-8z"></path>
            </svg>
          </div>
          <div class="station-info">
            <h2>Cebeco 1</h2>
            <p class="station-location">Cebu I Electric Cooperative, Inc.</p>
            <div class="status-row">
              <span class="availability"><span class="status-dot"></span>Available</span>
              <span class="distance">2.0 km</span>
            </div>
          </div>
          <button class="call-btn" type="button" data-provider="Cebeco 1">Call</button>
        </article>
      </section>

      <p class="feedback" aria-live="polite" hidden></p>
    </main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <a class="nav-item active" href="citizen.html" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10.8" cy="10.8" r="6.3"></circle>
          <path d="m15.5 15.5 4.2 4.2"></path>
        </svg>
        <span>Find</span>
      </a>
      <a class="nav-item" href="responders.html">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="9" cy="8" r="3"></circle>
          <path d="M3.5 19v-1.5a5.5 5.5 0 0 1 11 0V19zM16 5.5a3 3 0 0 1 0 5.8M18 14a4.5 4.5 0 0 1 2.5 4v1"></path>
        </svg>
        <span>Responder</span>
      </a>
      <button class="nav-item" type="button" data-nav="Log">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 3.5h9l3 3V20H6zM15 3.5v4h4M9 12h6M9 16h6"></path>
        </svg>
        <span>Log</span>
      </button>
    </nav>
  </div>
</body>
</html>
