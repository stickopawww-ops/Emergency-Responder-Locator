<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emergency Responder Locator</title>
  <link rel="stylesheet" href="citizen.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <script src="citizen.js" defer></script>
</head>
<body>
  <div class="phone">
    <header class="topbar">
      <button class="back-btn" aria-label="Back">
        <svg viewBox="0 0 24 24">
          <path d="M15 18L9 12L15 6" />
        </svg>
      </button>
      <div class="title">Emergency Responder Locator</div>
    </header>

    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="6"></circle>
        <path d="M16 16L21 21"></path>
      </svg>
      <input type="text" placeholder="Search" />
      <button class="mic-btn" aria-label="Voice Search">
        <svg viewBox="0 0 24 24">
          <path d="M12 15a3 3 0 0 0 3-3V7a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3z"></path>
          <path d="M19 11a7 7 0 0 1-14 0"></path>
          <path d="M12 18v3"></path>
        </svg>
      </button>
    </div>

    <div class="title">
      <h3>Who do you need help from?</h3>
    </div>

    <div class="grid">
      <a class="card card-link" href="ambulance.html">
        <div class="icon-wrap">
          <i class="fa-solid fa-truck-medical" aria-hidden="true"></i>
        </div>
        <div class="card-text">
          <h3>Ambulance</h3>
          <span>1 available</span>
        </div>
      </a>

      <a class="card card-link" href="fire-station.html">
        <div class="icon-wrap">
          <i class="fa-solid fa-fire" aria-hidden="true"></i>
        </div>
        <div class="card-text">
          <h3>Fire Station</h3>
          <span>2 available</span>
        </div>
      </a>

      <a class="card card-link" href="barangay-tanod.html">
        <div class="icon-wrap">
          <i class="fa-solid fa-user-shield" aria-hidden="true"></i>
        </div>
        <div class="card-text">
          <h3>Barangay Tanod</h3>
          <span>1 available</span>
        </div>
      </a>

      <div class="card">
        <div class="icon-wrap">
          <i class="fa-solid fa-shield-halved" aria-hidden="true"></i>
        </div>
        <div class="card-text">
          <h3>Police</h3>
          <span>1 available</span>
        </div>
      </div>
    
      <div class="card">
        <div class="icon-wrap">
          <i class="fa-solid fa-location-crosshairs" aria-hidden="true"></i>
        </div>
        <div class="card-text">
          <h3>Nearest Any</h3>
        </div>
      </div>
    </div>

    <div class="title">
      <h3>Other Services</h3>
    </div>

    <div class="other-list">
      <div class="other-item">
        <div class="tiny-icon">
          <svg viewBox="0 0 24 24">
            <path d="M13 2L4 13h6l-1 9 9-11h-6l1-9z"></path>
          </svg>
        </div>
        <div class="other-text">Power Outage</div>
        <div class="other-tag">Cebeco</div>
        </div>
      </div>

    <button class="emergency-btn">Life-threatening? Call 911 now</button>

    <div class="bottom-nav">
      <button class="nav-item active">
        <svg viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="6"></circle>
          <path d="M16 16L21 21"></path>
        </svg>
        <span>Find</span>
      </button>

      <button class="nav-item">
        <svg viewBox="0 0 24 24">
          <path d="M12 3a9 9 0 1 0 9 9"></path>
          <path d="M12 7v5l3 2"></path>
        </svg>
        <span>Responder</span>
      </button>

      <button class="nav-item">
        <svg viewBox="0 0 24 24">
          <path d="M6 3.5h9l3 3V19a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5.5a2 2 0 0 1 2-2z"></path>
          <path d="M15 3.5v4h4"></path>
          <path d="M8 11h8"></path>
          <path d="M8 15h8"></path>
        </svg>
        <span>Log</span>
      </button>
    </div>
  </div>
</body>
</html>
