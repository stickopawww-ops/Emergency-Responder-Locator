<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Verify Code</title>

<link rel="stylesheet" href="verification.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="phone">

<button class="back">

<i class="fa-solid fa-arrow-left"></i>

</button>

<div class="content">

<h1>Enter the code</h1>

<p class="subtitle">

Enter the demo code <strong>1234</strong> for

<strong id="phoneNumber"></strong>. No SMS is sent in this demo.

</p>

<div class="otp">

<input type="text" maxlength="1" inputmode="numeric" aria-label="Digit 1">

<input type="text" maxlength="1" inputmode="numeric" aria-label="Digit 2">

<input type="text" maxlength="1" inputmode="numeric" aria-label="Digit 3">

<input type="text" maxlength="1" inputmode="numeric" aria-label="Digit 4">

</div>

<button class="verify">

Verify

</button>

<p id="message" role="status" aria-live="polite"></p>

<p class="resend">

SMS delivery is not configured in this demo.

</p>

</div>

<div class="info-box">

<i class="fa-regular fa-circle-info"></i>

<p>

Connect an SMS provider to enable real verification.

</p>

</div>

</div>

<script src="verification.js"></script>

</body>

</html>
