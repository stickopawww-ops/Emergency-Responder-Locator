<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>

    <link rel="stylesheet" href="forgot-password.css">
    <link rel="stylesheet" href="../auth-layout.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

</head>

<body>


<div class="phone">


    <button class="back" type="button" aria-label="Back to sign in">
        <span>‹</span>
    </button>


    <h1>Forgot password?</h1>


    <p class="subtitle">
        Enter the number you registered with. We'll text you
        a 6 digit code to reset your password.
    </p>


    <form id="forgotPasswordForm">
    <label for="mobileNumber">Mobile Number</label>


    <div class="phone-input">

        <div class="code">
            +63
        </div>

        <input id="mobileNumber" type="tel" inputmode="numeric" maxlength="12" placeholder="991 654 2601" required>

    </div>



    <button class="send-btn" type="submit">
        Send code
    </button>
    <p id="message" role="status" aria-live="polite"></p>
    </form>


    <a class="back-login" href="../responder-sign-in/sign-in.html">
        Back to sign in
    </a>



    <div class="warning">

        <span class="info">
            ⓘ
        </span>

        <p>
            Weak signal? The code arrives by SMS,
            so you don't need data to sign in.
        </p>

    </div>


</div>



<script src="../../../api-client.js"></script>
<script src="forgot-password.js"></script>


</body>
</html>
