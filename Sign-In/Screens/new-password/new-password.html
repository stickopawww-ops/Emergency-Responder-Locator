<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Set New Password</title>

    <link rel="stylesheet" href="new-password.css">
    <link rel="stylesheet" href="../auth-layout.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

</head>


<body>


<div class="phone">


    <button class="back" type="button" aria-label="Cancel password reset">
        <span>‹</span>
    </button>



    <h1>Set new password</h1>



    <p class="subtitle">
        Create a new password for your responder account.
        Make sure it's strong and easy to remember.
    </p>



    <form id="resetPasswordForm">
    <label for="newPassword">New password</label>


    <div class="password-box">

        <input
        id="newPassword"
        class="password"
        type="password"
        autocomplete="new-password"
        required>


        <button type="button" class="show">
            Show
        </button>

    </div>



    <p class="hint">
        At least 8 characters with a number
    </p>



    <label for="confirmPassword">Confirm password</label>


    <div class="password-box">

        <input
        id="confirmPassword"
        class="password"
        type="password"
        autocomplete="new-password"
        required>


        <button type="button" class="show">
            Show
        </button>

    </div>



    <button class="reset-btn" type="submit">
        Reset password
    </button>
    <p id="resetMessage" role="status" aria-live="polite"></p>
    </form>



    <a class="signin" href="../responder-sign-in/sign-in.html">
        Back to sign in
    </a>



</div>



<script src="../password-utils.js"></script>
<script src="new-password.js"></script>


</body>

</html>
