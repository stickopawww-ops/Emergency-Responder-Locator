<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team</title>
<link rel="stylesheet" href="team.css">
</head>
<body>
<div class="phone">
  <div class="header">
    <div>
      <h1>Team</h1>
      <p>Manage your response team</p>
    </div>
    <button class="add-btn" onclick="addResponder()">+ Add Responder</button>
  </div>

  <div class="filters">
    <button class="filter active" onclick="filterTeam('All', this)">All</button>
    <button class="filter" onclick="filterTeam('Available', this)">Available</button>
    <button class="filter" onclick="filterTeam('Busy', this)">Busy</button>
    <button class="filter" onclick="filterTeam('Off', this)">Off</button>
  </div>

  <div id="teamList"></div>

  <dialog id="addResponderDialog">
    <form id="addResponderForm">
      <h2>Add responder</h2>
      <label for="responderName">Responder name</label>
      <input id="responderName" name="responderName" maxlength="60" required>
      <div class="dialog-actions">
        <button type="button" id="cancelAddResponder">Cancel</button>
        <button type="submit">Add</button>
      </div>
    </form>
  </dialog>

  <div class="bottom-nav">
    <a href="#">Live</a>
    <a href="#">Map</a>
    <a href="approval.html">Approval</a>
    <a href="team.html" class="active">Team</a>
    <a href="#">History</a>
  </div>
</div>
<script src="team.js"></script>
</body>
</html>
