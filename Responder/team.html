<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team - Cebu City Dispatch</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
  body{background:#f5f5f5;padding:16px;padding-bottom:80px}
  .top{display:flex;justify-content:space-between;align-items:center}
  .top small{color:#666;font-size:13px}
  .top h1{font-size:28px;color:#1E2E44}
  .rv{width:40px;height:40px;background:#1E2E44;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold}
  .add{width:100%;background:#1E2E44;color:#fff;border:none;padding:14px;border-radius:25px;font-size:16px;margin:16px 0 12px}
  .filters{display:flex;gap:8px;margin-bottom:16px}
  .filters button{border:none;padding:8px 16px;border-radius:20px;background:transparent;color:#1E2E44;font-size:15px}
  .filters button.active{background:#1E2E44;color:#fff}
  .card{background:#fff;padding:16px;border-radius:12px;margin-bottom:12px}
  .card b{color:#1E2E44;font-size:16px}
  .card p{color:#666;font-size:14px;margin:4px 0 8px}
  .badge{display:inline-block;background:#c8f5c8;color:#0a6b0a;padding:4px 12px;border-radius:12px;font-size:12px;font-weight:bold}
  .nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:12px;border-top:1px solid #ddd}
  .nav a{text-decoration:none;color:#888;font-weight:bold;position:relative}
  .nav a.active{color:#1E2E44}
  .dot{position:absolute;top:-8px;right:-12px;background:red;color:#fff;font-size:10px;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div class="top">
  <div><small>Cebu City Dispatch</small><h1>Team</h1></div>
  <div class="rv">RV</div>
</div>
<button class="add">+ Add Responder</button>
<div class="filters">
  <button onclick="filterTeam('all',this)">All</button>
  <button class="active" onclick="filterTeam('Available',this)">Available</button>
  <button onclick="filterTeam('Busy',this)">Busy</button>
  <button onclick="filterTeam('Off',this)">Off</button>
</div>
<div id="list"></div>
<div class="nav">
  <a href="#">Live<span class="dot">1</span></a>
  <a href="#">Map</a>
  <a href="approval.html">Approval<span class="dot">1</span></a>
  <a href="team.html" class="active">Team</a>
  <a href="#">History</a>
</div>
<script>
const team = [
  {name:"Ambulance 1", place:"Ginatilan Rural Health Unit", status:"Available"},
  {name:"Ambulance 1", place:"Ginatilan Municipal Health Office", status:"Available"},
  {name:"Fire Truck 1", place:"BFP R7 Ginatilan Fire Station", status:"Available"},
  {name:"Tanod Post A", place:"San Roque Barangay Hall", status:"Available"},
  {name:"Police Station", place:"Ginatilan Municipal Police Station", status:"Available"},
];
function render(filter='Available'){
  const list = document.getElementById('list');
  list.innerHTML = '';
  team.filter(t => filter==='all' || t.status===filter).forEach(t=>{
    list.innerHTML += `<div class="card"><b>${t.name}</b><p>${t.place}</p><span class="badge">${t.status}</span></div>`;
  });
}
function filterTeam(status, btn){
  document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render(status);
}
render();
</script>
</body>
</html>
