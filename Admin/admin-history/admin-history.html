<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History - Cebu City Dispatch</title>
  <link rel="stylesheet" href="admin-history.css">
</head>
<body>
  <div class="phone">
    <header class="top">
      <div>
        <small>Cebu City Dispatch</small>
        <h1>History</h1>
      </div>
      <a class="avatar" href="../admin-profile/profile.html" aria-label="Open admin profile">RV</a>
    </header>

    <div class="tabs" role="tablist" aria-label="History views">
      <button class="tab active" id="incidentTab" type="button" role="tab" aria-selected="true" aria-controls="incidentView" data-tab="incident">Incidents</button>
      <button class="tab" id="activityTab" type="button" role="tab" aria-selected="false" aria-controls="activityView" data-tab="activity">Admin activity</button>
    </div>

    <label class="sr-only" for="searchInput">Search incidents and activity</label>
    <input type="search" id="searchInput" placeholder="Search incidents, places, units" />

    <div class="filters" id="filters" aria-label="Filter incidents by status">
      <button class="filter active" type="button" data-filter="all">All</button>
      <button class="filter" type="button" data-filter="UNASSIGNED">Unassigned</button>
      <button class="filter" type="button" data-filter="ASSIGNED">Assigned</button>
      <button class="filter" type="button" data-filter="RESOLVED">Resolved</button>
    </div>

    <p id="historyError" class="error" role="alert" hidden></p>
    <section id="incidentView" class="list" role="tabpanel" aria-labelledby="incidentTab"></section>

    <section id="activityView" class="list hidden" role="tabpanel" aria-labelledby="activityTab"></section>

    <button id="exportBtn" class="export" type="button">Export report (CSV)</button>

    <nav class="bottom-nav" aria-label="Admin navigation">
      <a href="../live.html">Live</a>
      <a href="../../Admin(Responder)/map.html">Map</a>
      <a href="../approval.html">Approval</a>
      <a href="../team.html">Team</a>
      <a class="active-nav" href="admin-history.html" aria-current="page">History</a>
    </nav>
  </div>
  <script src="../../api-client.js"></script>
  <script src="admin-history.js"></script>
</body>
</html>
