
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cebu City Dispatch</title>
    <link rel="stylesheet" href="live.css">
</head>
<body>

<div class="app-container">

    <main class="dashboard">

        <!-- HEADER -->
        <header class="header">
            <div class="header-text">
                <p>Cebu City Dispatch</p>
                <h1>Live Incidents</h1>
            </div>

            <a class="profile" href="admin-profile/profile.html" aria-label="Open admin profile">RV</a>
        </header>

        <!-- STATISTICS -->
        <section class="statistics">

            <div class="stat-card">
                <h2>0</h2>
                <span>Active</span>
            </div>

            <div class="stat-card">
                <h2>0</h2>
                <span>Unassigned</span>
            </div>

            <div class="stat-card">
                <h2>0</h2>
                <span>Units free</span>
            </div>

        </section>

        <!-- ALERT -->
        <button class="alert-button" id="alertAll">
            Send alert to all units
        </button>

        <!-- FILTER TABS -->
        <section class="tabs">

            <button class="tab active" id="allActive">
                All active
            </button>

            <button class="tab" id="unassigned">
                Unassigned
            </button>

        </section>

        <!-- LIVE INCIDENT -->
        <section class="incident-container" aria-live="polite">
            <p class="empty-state">Loading incidents...</p>
        </section>

    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-navigation">

        <a class="nav-item selected" href="live.html" aria-current="page">
            <span>Live</span>
            <span class="badge" id="liveBadge">0</span>
        </a>

        <a class="nav-item" href="../Admin(Responder)/map.html">
            Map
        </a>

        <a class="nav-item" href="approval.html">
            <span>Approval</span>
            <span class="badge" id="approvalBadge">0</span>
        </a>

        <a class="nav-item" href="team.html">
            Team
        </a>

        <a class="nav-item" href="admin-history/admin-history.html">
            History
        </a>

    </nav>

</div>

<script src="../api-client.js"></script>
<script src="live.js"></script>

</body>
</html>
