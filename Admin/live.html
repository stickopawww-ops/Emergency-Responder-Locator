
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cebu City Dispatch</title>
    <link rel="stylesheet" href="live.css">
</head>
<body>

<div class="app-container">

    <main class="dashboard">

        <!-- HEADER -->
        <header class="header">
            <div class="header-text">
                <p>Cebu City Dispatch</p>
                <h1>Live Incidents</h1>
            </div>

            <a class="profile" href="admin-profile/profile.html" aria-label="Open admin profile">RV</a>
        </header>

        <!-- STATISTICS -->
        <section class="statistics">

            <div class="stat-card">
                <h2>1</h2>
                <span>Active</span>
            </div>

            <div class="stat-card">
                <h2>1</h2>
                <span>Unassigned</span>
            </div>

            <div class="stat-card">
                <h2>1</h2>
                <span>Units free</span>
            </div>

        </section>

        <!-- ALERT -->
        <button class="alert-button" id="alertAll">
            Send alert to all units
        </button>

        <!-- FILTER TABS -->
        <section class="tabs">

            <button class="tab active" id="allActive">
                All active
            </button>

            <button class="tab" id="unassigned">
                Unassigned
            </button>

        </section>

        <!-- LIVE INCIDENT -->
        <section class="incident-container">

            <div class="incident-card" id="incidentCard">

                <div class="incident-details">

                    <h3>Chest pain, adult male</h3>

                    <p class="incident-location">
                        Brgy. Lahug Ambulance · 12:59
                    </p>

                    <div class="incident-tags">

                        <span class="priority-tag">
                            High Priority
                        </span>

                        <span class="waiting-tag">
                            Unassigned, waiting for 4 mins.
                        </span>

                    </div>

                </div>

                <button class="assign-button" id="assignButton">
                    Assign
                </button>

            </div>

        </section>

    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-navigation">

        <button class="nav-item selected">
            <span>Live</span>
            <span class="badge">1</span>
        </button>

        <button class="nav-item">
            Map
        </button>

        <button class="nav-item">
            <span>Approval</span>
            <span class="badge">3</span>
        </button>

        <button class="nav-item">
            Team
        </button>

        <button class="nav-item">
            History
        </button>

    </nav>

</div>

<script src="../api-client.js"></script>
<script src="live.js"></script>

</body>
</html>
