<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Responder</title>

<link rel="stylesheet" href="add-responder.css">

</head>

<body>

<div class="phone">

<header>

<button class="back-btn" type="button" aria-label="Go back">
    <span class="arrow"></span>
</button>

<div class="app-header">

<svg class="shield-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M12 2.5L4.5 5.5V11C4.5 16 7.7 19.5 12 21.5C16.3 19.5 19.5 16 19.5 11V5.5L12 2.5Z"
        stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
</svg>

<span class="app-name">
Cebu Emergency Help
</span>

<span class="admin-badge">
ADMIN
</span>

</div>

</header>

<main>

<section class="page-title">

<h1>
Add Responder
</h1>

<p>
Invite a responder to join the emergency network
</p>

</section>

<section class="form-card">

<div class="input-group">

<label>
Full Name
</label>

<input 
type="text"
placeholder="Enter responder name"
>

</div>

<div class="input-group">

<label>
Email Address
</label>

<input 
type="email"
placeholder="Enter email address"
>

</div>

<div class="input-group">

<label>
Contact Number
</label>

<input 
type="text"
placeholder="Enter contact number"
>

</div>

<div class="input-group">

<label>
Responder Type
</label>

<select>

<option>
Select type
</option>

<option>
Police
</option>

<option>
Firefighter
</option>

<option>
Medical
</option>

<option>
Volunteer
</option>

</select>

</div>

<div class="input-group">

<label>
Organization / Station
</label>

<input 
type="text"
placeholder="Enter organization"
>

</div>

</section>

<button class="invite-btn">
Send Invitation
</button>

</main>

</div>

<script src="add-responder.js"></script>

</body>

</html>
