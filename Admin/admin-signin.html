
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Sign In | Cebu Emergency Help</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">

        <div class="login-content">

            <header class="header">
                <div class="brand">
                    <svg class="shield-icon" viewBox="0 0 24 24" fill="none">
                        <path d="M12 2.5L20 5.5V11C20 16.5 16.5 20 12 22C7.5 20 4 16.5 4 11V5.5L12 2.5Z"
                        stroke="currentColor" stroke-width="1.8"
                        stroke-linejoin="round"/>
                    </svg>

                    <span>Cebu Emergency Help</span>
                </div>

                <span class="admin-badge">ADMIN</span>
            </header>

            <section class="login-form">

                <h1>Admin sign in</h1>

                <p class="description">
                    For dispatch staff only. Responders and citizens use the main app.
                </p>

                <form>

                    <div class="form-group">
                        <label for="email">Work email</label>
                        <input
                            type="email"
                            id="email"
                            value="rosa@cebucity.gov.ph"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>

                        <div class="password-wrapper">
                            <input
                                type="password"
                                id="password"
                                value="password"
                                required
                            >

                            <button
                                type="button"
                                class="show-button"
                                onclick="togglePassword()"
                            >
                                Show
                            </button>
                        </div>
                    </div>

                    <div class="form-buttons">
                        <button type="submit" class="sign-in-button">
                            Sign in
                        </button>

                        <button type="button" class="forgot-button">
                            Forgot password
                        </button>
                    </div>

                </form>

            </section>

        </div>

        <footer>
            Every sign in and action is recorded in the activity log.
        </footer>

    </div>

    <script>
        function togglePassword() {
            const password = document.getElementById("password");
            const button = document.querySelector(".show-button");

            if (password.type === "password") {
                password.type = "text";
                button.textContent = "Hide";
            } else {
                password.type = "password";
                button.textContent = "Show";
            }
        }
    </script>

</body>
</html>
