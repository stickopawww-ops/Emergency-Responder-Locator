<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Profile</title>

<link rel="stylesheet" href="profile.css">

</head>


<body>


<div class="phone">


<header>

    <button class="back-btn">
        <span class="arrow"></span>
    </button>


    <div class="app-header">

        <svg class="shield-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M12 2.5L4.5 5.5V11C4.5 16 7.7 19.5 12 21.5C16.3 19.5 19.5 16 19.5 11V5.5L12 2.5Z"
                stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        </svg>

        <span class="app-name">
            Cebu Emergency Help
        </span>

        <span class="admin-badge">
            ADMIN
        </span>

    </div>

</header>

<main>


<section class="page-title">

<h1>
Profile
</h1>


<p>
Your admin account
</p>


</section>





<section class="profile-card">


<div class="avatar">

RS

</div>


<div class="profile-info">


<h3>
Rosa Santos
</h3>


<span>
rosa@gmail.com
</span>


</div>


</section>






<section class="admins-section">


<p class="section-label">

ADMINS (2 OF 3)

</p>





<div class="admin-item">


<div class="admin-left">


<h4>
Rosa Santos (you)
</h4>


<span>
rosa@gmail.com
</span>


</div>


<div class="status active">

Active

</div>


</div>







<div class="admin-item">


<div class="admin-left">


<h4>
Pedro Reyes
</h4>


<span>
pedroreyes@gmail.com
</span>


</div>


<div class="status active">

Active

</div>


</div>







<div class="admin-item pending-item">


<div class="admin-left">


<h4>
juan@gmail.com
</h4>


<span>
Invites expire in 47 hours
</span>


</div>




<div class="pending-right">


<div class="status pending">

Pending

</div>



<button class="cancel-btn">

Cancel Invite

</button>



</div>


</div>



</section>






<section class="actions">


<button 
class="primary-btn"
id="inviteAdminBtn">

Invite an admin

</button>



<button 
class="secondary-btn"
id="logoutBtn">

Log out

</button>



</section>




</main>


</div>



<script src="profile.js"></script>


</body>

</html>
