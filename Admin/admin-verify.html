<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f7f3ff">
    <title>Confirm It Is You</title>
    <link rel="stylesheet" href="admin-verify.css">
</head>
<body>

    <main class="screen">

        <button class="back-button" type="button" onclick="goBack()">
            <span>←</span> Back
        </button>

        <h2>Confirm it is you</h2>

        <p class="description" id="phoneDescription">
            Enter the 6-digit code sent to your registered phone.
        </p>

        <form id="otpForm">

            <div class="otp-container">
                <input class="otp-input" type="text" maxlength="1" inputmode="numeric" aria-label="Digit 1">
                <input class="otp-input" type="text" maxlength="1" inputmode="numeric" aria-label="Digit 2">
                <input class="otp-input" type="text" maxlength="1" inputmode="numeric" aria-label="Digit 3">
                <input class="otp-input" type="text" maxlength="1" inputmode="numeric" aria-label="Digit 4">
                <input class="otp-input" type="text" maxlength="1" inputmode="numeric" aria-label="Digit 5">
                <input class="otp-input" type="text" maxlength="1" inputmode="numeric" aria-label="Digit 6">
            </div>

            <button class="verify-button" type="submit">
                Verify and sign in
            </button>

        </form>

        <p class="resend-text">
            <span id="resendLabel">Resend code in </span>
            <span id="timer">0:30</span>
        </p>

    </main>

    <script src="admin-verify.js"></script>
</body>
</html>
