<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm It's You</title>
    <link rel="stylesheet" href="admin-verify.css">
</head>
<body>

    <main class="screen">

        <button class="back-button" type="button" onclick="goBack()">
            <span>←</span> Back
        </button>

        <h2>Confirm it is you</h2>

        <p class="description" id="phoneDescription">
            Enter the 6-digit code sent to your registered phone.
        </p>

        <div class="otp-container">
            <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1"
                   class="otp-input" autocomplete="one-time-code" aria-label="Digit 1">
            <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1"
                   class="otp-input" autocomplete="off" aria-label="Digit 2">
            <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1"
                   class="otp-input" autocomplete="off" aria-label="Digit 3">
            <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1"
                   class="otp-input" autocomplete="off" aria-label="Digit 4">
            <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1"
                   class="otp-input" autocomplete="off" aria-label="Digit 5">
            <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1"
                   class="otp-input" autocomplete="off" aria-label="Digit 6">
        </div>

        <p id="message" class="message" role="alert" aria-live="polite"></p>

        <button class="verify-button" onclick="verifyCode()">
            Verify and sign in
        </button>

        <p class="resend-text">
            <span id="resendLabel">Resend code in </span>
            <span id="timer">0:30</span>
        </p>

    <script src="admin-verify.js"></script>
</body>
</html>
