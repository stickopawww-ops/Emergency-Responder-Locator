<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Verification | Cebu Emergency Help</title>
    <link rel="stylesheet" href="admin-signin.css">
    <link rel="stylesheet" href="admin-verify.css">
</head>
<body>
    <main class="verify-screen">
        <header class="header">
            <span class="brand-name">Cebu Emergency Help</span>
            <span class="admin-badge">ADMIN</span>
        </header>

        <section class="verify-content">
            <h1>Verify your sign in</h1>
            <p id="phoneDescription">Enter the six-digit code printed in the backend terminal, or your configured local code.</p>

            <form id="otpForm">
                <div class="otp-row" aria-label="6-digit verification code">
                    <input class="otp-input" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 1">
                    <input class="otp-input" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 2">
                    <input class="otp-input" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 3">
                    <input class="otp-input" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 4">
                    <input class="otp-input" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 5">
                    <input class="otp-input" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 6">
                </div>
                <button type="submit" class="signin-button">Verify</button>
            </form>

            <p id="resend-message">Resend code in</p>
            <button type="button" id="timer" class="timer">0:30</button>
        </section>
    </main>
    <script src="../api-client.js"></script>
    <script src="admin-verify.js"></script>
</body>
</html>
