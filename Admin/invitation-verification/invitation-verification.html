<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Verification</title>

    <link rel="stylesheet" href="invitation-verification.css">

</head>

<body>

<div class="phone">

<header>
    <button class="back-btn" type="button" aria-label="Go back">
        <span class="arrow"></span>
    </button>

    <div class="app-header">
        <svg class="shield-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M12 2.5L4.5 5.5V11C4.5 16 7.7 19.5 12 21.5C16.3 19.5 19.5 16 19.5 11V5.5L12 2.5Z"
                stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        </svg>
        <span class="app-name">
            Cebu Emergency Help
        </span>

        <span class="admin-badge">
            ADMIN
        </span>
    </div>
</header>

<main>
<section class="verification-title">
<h1>
    Verify Invitation
</h1>

<p>
    Enter the code sent to your email
</p>
</section>

<section class="invite-card">

<div class="invite-icon">
    <svg viewBox="0 0 24 24">
        <path d="M12 12C14.2 12 16 10.2 16 8C16 5.8 14.2 4 12 4C9.8 4 8 5.8 8 8C8 10.2 9.8 12 12 12Z"/>
        <path d="M4 20C4 16.7 7.6 14 12 14C16.4 14 20 16.7 20 20"/>
    </svg>
</div>

<h2>
    Admin Invitation
</h2>

<p>
    You have been invited to join
</p>

<span class="email">
    admin@email.com
</span>

</section>

<section class="code-section">

<label>
Verification Code
</label>

<div class="code-boxes">

<input maxlength="1">
<input maxlength="1">
<input maxlength="1">
<input maxlength="1">
<input maxlength="1">
<input maxlength="1">

</div>

</section>

<button class="verify-btn">
Verify Invitation
</button>

<button class="resend-btn">
Resend Code
</button>
</main>
</div>
<script src="invitation-verification.js"></script>
</body>
</html>
